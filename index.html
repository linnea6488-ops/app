<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#F5EFE9"><title>Motivation</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body>
<div class="app">
<header class="header"><button class="brand" id="brand">Motivation</button><button class="icon-button menu" id="menu" aria-label="Open menu"><span></span><span></span><span></span></button></header>
<main id="home">
<div class="preview-wrap"><div class="wallpaper"><img class="wallpaper-image" src="assets/provided-night-0.jpg" alt=""><div class="wallpaper-copy"><p class="quote"></p><p class="source"></p></div></div><div class="preview-actions"><button class="circle" id="favorite" aria-label="Add to favorites" aria-pressed="false"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8.5 5.5H19.5C20.0523 5.5 20.5 5.94772 20.5 6.5V22.5L14 18.2L7.5 22.5V6.5C7.5 5.94772 7.94772 5.5 8.5 5.5Z" stroke="#1A1918" stroke-width="1.6" stroke-linejoin="round"/>
          </svg></button><button class="circle" id="share" aria-label="Share wallpaper"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 17.5V5.5M14 5.5L9.5 10M14 5.5L18.5 10" stroke="#1A1918" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 13.5V20.5C8 21.3284 8.67157 22 9.5 22H18.5C19.3284 22 20 21.3284 20 20.5V13.5" stroke="#1A1918" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg></button></div></div>
<div class="entries"><button class="entry" data-open="image"><img id="entry-image" src="assets/provided-night-0.jpg" alt=""><span>Background</span></button><button class="entry" data-open="type"><span class="aa" aria-hidden="true">Aa</span><span>Typography</span></button><button class="entry" data-open="ideas"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 8.5C14.2 7.1 10.2 6.8 6.5 7.6V24.6C10.2 23.8 14.2 24.1 17 25.5M17 8.5C19.8 7.1 23.8 6.8 27.5 7.6V24.6C23.8 23.8 19.8 24.1 17 25.5M17 8.5V25.5" stroke="#1A1918" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9.5 12.2C11.5 11.9 13.2 12.1 14.5 12.6M9.5 16.2C11.5 15.9 13.2 16.1 14.5 16.6" stroke="#1A1918" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M24.5 12.2C22.5 11.9 20.8 12.1 19.5 12.6M24.5 16.2C22.5 15.9 20.8 16.1 19.5 16.6" stroke="#1A1918" stroke-width="1.4" stroke-linecap="round"/>
          </svg><span>Inspiration</span></button></div>
<button class="primary" id="save">Save</button>
<p id="storage-error" class="error" role="status" hidden></p>
</main>
<div id="editor" class="editor" role="dialog" aria-modal="true" aria-label="Wallpaper editor" hidden>
<button class="preview-backdrop" id="preview-close" aria-label="Close editor and return home"><span class="mini-preview"><div class="wallpaper"><img class="wallpaper-image" src="assets/provided-night-0.jpg" alt=""><div class="wallpaper-copy"><p class="quote"></p><p class="source"></p></div></div></span></button>
<section id="sheet" class="sheet">
<div class="sheet-heading"><button class="handle" id="handle" aria-label="Expand editor" aria-expanded="false"><span></span></button><button id="close-editor" class="icon-button close" aria-label="Close editor">×</button></div>
<div class="tabs" role="tablist" aria-label="Editor"><button id="tab-image" role="tab" aria-controls="panel-image" aria-selected="true" data-tab="image">Image</button><button id="tab-type" role="tab" aria-controls="panel-type" aria-selected="false" data-tab="type" tabindex="-1">Type</button><button id="tab-ideas" role="tab" aria-controls="panel-ideas" aria-selected="false" data-tab="ideas" tabindex="-1">Ideas</button></div>
<div class="sheet-content" id="sheet-content">
<section class="panel" id="panel-image" role="tabpanel" aria-labelledby="tab-image"><div class="image-grid"><button type="button" class="image-option" data-background="0" aria-label="Boat in night mist" aria-pressed="false"><img src="assets/provided-night-0.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button><button type="button" class="image-option" data-background="1" aria-label="Lone tree at night" aria-pressed="false"><img src="assets/provided-night-1.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button><button type="button" class="image-option" data-background="2" aria-label="Bamboo shadows by a window" aria-pressed="false"><img src="assets/provided-night-2.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button><button type="button" class="image-option" data-background="3" aria-label="Crescent over cold mountains" aria-pressed="false"><img src="assets/provided-night-3.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button><button type="button" class="image-option" data-background="4" aria-label="Light on a dark sea" aria-pressed="false"><img src="assets/provided-night-4.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button><button type="button" class="image-option" data-background="5" aria-label="Curtains in the night breeze" aria-pressed="false"><img src="assets/provided-night-5.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button><button type="button" class="image-option" data-background="6" aria-label="Snowfield at night" aria-pressed="false"><img src="assets/provided-night-6.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button><button type="button" class="image-option" data-background="7" aria-label="Dark vase and bare branches" aria-pressed="false"><img src="assets/provided-night-7.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button><button type="button" class="image-option" data-background="8" aria-label="Dunes beneath the stars" aria-pressed="false"><img src="assets/provided-night-8.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button><button type="button" class="image-option" data-background="9" aria-label="Reeds over a still pool" aria-pressed="false"><img src="assets/provided-night-9.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button><button type="button" class="image-option" data-background="10" aria-label="Pier in night mist" aria-pressed="false"><img src="assets/provided-night-10.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button><button type="button" class="image-option" data-background="11" aria-label="Ginkgo on dark stone" aria-pressed="false"><img src="assets/provided-night-11.jpg" alt="" loading="lazy"><span class="selected-mark" aria-hidden="true">✓</span></button></div><p class="helper">Choose a background for your words.</p></section>
<section class="panel" id="panel-type" role="tabpanel" aria-labelledby="tab-type" hidden><label for="quote-input">Quote</label><textarea id="quote-input" rows="4" placeholder="Write your own words…"></textarea><label for="source-input">Source</label><textarea id="source-input" rows="2" placeholder="Add an author or source (optional)"></textarea><span id="alignment-label" class="field-label">Alignment</span><div class="alignment" role="group" aria-labelledby="alignment-label"><button type="button" data-align="left" aria-label="Align left" aria-pressed="false"><svg aria-hidden="true" width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="0" y="0" width="18" height="1.6" rx="0.8" fill="#1A1918"/>
                  <rect x="0" y="4.8" width="11" height="1.6" rx="0.8" fill="#1A1918"/>
                  <rect x="0" y="9.6" width="14.5" height="1.6" rx="0.8" fill="#1A1918"/>
                  <rect x="0" y="14.4" width="14.5" height="1.6" rx="0.8" fill="#1A1918"/>
                </svg></button><button type="button" data-align="center" aria-label="Align center" aria-pressed="true"><svg aria-hidden="true" width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="0" y="0" width="18" height="1.6" rx="0.8" fill="#1A1918"/>
                  <rect x="3.5" y="4.8" width="11" height="1.6" rx="0.8" fill="#1A1918"/>
                  <rect x="1.75" y="9.6" width="14.5" height="1.6" rx="0.8" fill="#1A1918"/>
                  <rect x="1.75" y="14.4" width="14.5" height="1.6" rx="0.8" fill="#1A1918"/>
                </svg></button><button type="button" data-align="right" aria-label="Align right" aria-pressed="false"><svg aria-hidden="true" width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="0" y="0" width="18" height="1.6" rx="0.8" fill="#1A1918"/>
                  <rect x="7" y="4.8" width="11" height="1.6" rx="0.8" fill="#1A1918"/>
                  <rect x="3.5" y="9.6" width="14.5" height="1.6" rx="0.8" fill="#1A1918"/>
                  <rect x="3.5" y="14.4" width="14.5" height="1.6" rx="0.8" fill="#1A1918"/>
                </svg></button></div></section>
<section class="panel" id="panel-ideas" role="tabpanel" aria-labelledby="tab-ideas" hidden><div class="categories" role="group" aria-label="Quote categories"><button class="category" data-category="Recommended" aria-pressed="false">Recommended</button><button class="category" data-category="Philosophy" aria-pressed="false">Philosophy</button><button class="category" data-category="Motivation" aria-pressed="false">Motivation</button><button class="category" data-category="Love" aria-pressed="false">Love</button><button class="category" data-category="Family" aria-pressed="false">Family</button></div><p class="helper ideas-label">Original words · AI-created</p><div id="ideas-grid" class="ideas-grid"></div><p id="ideas-empty" class="helper" hidden>No quotes in this category yet.</p></section>
</div></section></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</div></body></html>
